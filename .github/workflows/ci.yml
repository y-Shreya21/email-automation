name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify Pipeline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests -v

      - name: End-to-End CLI Dry-Run Verification
        run: |
          echo "=== 1. Generating synthetic sample dataset ==="
          python main.py sample --rows 100

          echo "=== 2. Cleaning and deduplicating dataset ==="
          python main.py clean --file sample_recruiter_contacts.xlsx

          echo "=== 3. Batch approving Tier 1 contacts ==="
          python main.py approve-all --tier 1

          echo "=== 4. Generating visual HTML dashboard ==="
          python main.py dashboard --tier 1

          echo "=== 5. Testing Gmail draft creation (Dry-Run) ==="
          python main.py draft --tier 1 --batch-size 5 --dry-run

          echo "=== 6. Testing simulated sending (Dry-Run) ==="
          python main.py send --tier 1 --batch-size 2 --dry-run --confirm-send

          echo "=== 7. Verifying campaign status report ==="
          python main.py status

          echo "=== 8. Running Automated Security & Safety Audit ==="
          python main.py audit

  security-check:
    name: Security & Credential Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit Repository for Leaked Secrets & Spreadsheets
        run: |
          echo "Checking repository for forbidden credential, token, or spreadsheet files..."
          FORBIDDEN_FILES=(
            "credentials.json"
            "token.json"
            "Untitled spreadsheet.xlsx"
            "data/cleaned_contacts.xlsx"
            "data/quarantined_records.xlsx"
            "data/outreach_history.db"
            "resume.pdf"
            ".env"
          )
          LEAK_FOUND=0
          for file in "${FORBIDDEN_FILES[@]}"; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              echo "❌ SECURITY ALERT: Forbidden file '$file' is tracked in Git!"
              LEAK_FOUND=1
            else
              echo "✓ $file is safely untracked/ignored."
            fi
          done

          echo "Scanning all commit history for OAuth secrets, tokens, and private keys..."
          if git log -p | grep -E "(GOCSPX-[A-Za-z0-9_-]{20,}|ya29\.[A-Za-z0-9_-]{20,}|BEGIN (?:RSA )?PRIVATE KEY|\"client_secret\":\s*\"[^\"]{15,}\")"; then
            echo "❌ SECURITY ALERT: High-entropy secret key pattern found in git log!"
            LEAK_FOUND=1
          else
            echo "✓ Git history is 100% clean of private keys and secrets."
          fi

          if [ $LEAK_FOUND -ne 0 ]; then
            echo "Security audit failed!"
            exit 1
          fi
          echo "✓ All automated leak detection checks passed cleanly."
